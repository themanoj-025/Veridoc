[project]
name = "veridoc"
version = "0.1.0"
description = "Answers you can verify, not just believe."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "BLE", "DTZ", "E", "F", "G", "PLW", "RUF", "SIM", "ASYNC", "W", "UP", "C4", "PLC", "PIE", "I"]
ignore = [
    "E501",    # line too long — style preference
    "PLW0603", # global statement — singleton/cache pattern
    "G004",    # logging f-string — acceptable for structured logging
    "ASYNC240", # blocking pathlib in async — server uses local disk
    "B905",    # zip-without-strict — legacy code
    "B904",    # raise-without-from — legacy code
    "RUF006",  # asyncio-dangling-task — intentional fire-and-forget
    "ASYNC109", # async-with-timeout — parameter style
    "F403",    # import-star — alembic migration pattern
    "RUF001",  # ambiguous unicode — intentional multiplication sign
    "RUF102",  # invalid-rule-code — forward compat
    "PLC0415", # import-outside-top-level — lazy imports
    "BM25",    # blind match — pattern matching style
    "G201",    # logging exception info — intentional
    "F300",    # f-string without placeholder — intentional
]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI Depends() in route signatures is idiomatic (lazy evaluation)
"backend/app/api/*.py" = ["B008"]
"backend/app/core/dependencies.py" = ["B008"]
"backend/alembic/**/*.py" = ["SIM105"]  # migration scripts use try-except-pass for row-level error handling

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
testpaths = ["backend/tests", "scripts"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true

warn_unused_ignores = true

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_empty = true

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20.0,<2.0",
    "opentelemetry-sdk>=1.44.0,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0,<1.0",
]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix, --select, "E9,F,I"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
  # NOTE: mypy deliberately NOT here — the hook's isolated venv lacks repo deps,
  # producing ~75 false findings (Any-leaks, alembic `op`). Type checking runs
  # as an advisory CI job (ci.yml `mypy`) with the real environment instead;
  # promote it to blocking once the pre-existing backlog is cleared.

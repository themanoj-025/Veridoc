name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint with flake8
        run: flake8 app/ tests/ --max-line-length=120

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veridoc
          POSTGRES_PASSWORD: veridoc_local_dev
          POSTGRES_DB: veridoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      chroma:
        image: chromadb/chroma:0.5.5
        ports:
          - 8001:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests (no external services)
        env:
          POSTGRES_HOST: localhost
          APP_ENV: test
        # Exclude integration tests (which need testcontainers Docker-in-Docker)
        # and health tests (which try to connect to actual Chroma/Ollama)
        run: python -m pytest tests/ -v --timeout=30 \
          -k "not integration and not health"

  test-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veridoc
          POSTGRES_PASSWORD: veridoc_local_dev
          POSTGRES_DB: veridoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      chroma:
        image: chromadb/chroma:0.5.5
        ports:
          - 8001:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run integration tests (Postgres + Chroma)
        env:
          POSTGRES_HOST: localhost
          CHROMA_HOST: localhost
          APP_ENV: test
        run: python -m pytest tests/ -v --timeout=120 \
          -k "integration or health"

  eval-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veridoc
          POSTGRES_PASSWORD: veridoc_local_dev
          POSTGRES_DB: veridoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run evaluation regression gate
        env:
          POSTGRES_HOST: localhost
          APP_ENV: test
          SKIP_LLM: "true"
        run: python scripts/ci_eval_gate.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build

  # E2E smoke test (B6) — requires full Docker Compose stack
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veridoc
          POSTGRES_PASSWORD: veridoc_local_dev
          POSTGRES_DB: veridoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      chroma:
        image: chromadb/chroma:0.5.5
        ports:
          - 8001:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start Ollama (CPU mode)
        run: |
          docker run -d --rm --name ollama -p 11434:11434 ollama/ollama:latest
          # Wait for Ollama to start
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama ready"
              break
            fi
            sleep 2
          done
          # Pull the small model
          docker exec ollama ollama pull tinyllama || echo "Model pull skipped"
      - name: Start backend
        env:
          DATABASE_URL: postgresql+asyncpg://veridoc:veridoc_local_dev@localhost:5432/veridoc
          CHROMA_HOST: localhost
          CHROMA_PORT: 8001
          OLLAMA_BASE_URL: http://localhost:11434
          APP_ENV: production
        run: |
          cd backend
          pip install -r requirements.txt
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # Wait for backend to be ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            echo "Waiting for backend... ($i/15)"
            sleep 2
          done
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Start frontend
        run: |
          cd frontend
          NEXT_PUBLIC_API_URL=http://localhost:8000 npx next start &
          sleep 3
      - name: Run E2E smoke tests
        run: |
          cd frontend
          npx playwright install chromium
          npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # SBOM + vulnerability scanning (D9)
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (backend)
        run: |
          syft dir:backend -o spdx-json > sbom.backend.json || echo "Syft backend scan skipped"

      - name: Generate SBOM (frontend)
        run: |
          syft dir:frontend -o spdx-json > sbom.frontend.json || echo "Syft frontend scan skipped"

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom*.json
          retention-days: 30

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.55.2

      - name: Trivy vulnerability scan — backend (filesystem scan)
        continue-on-error: true
        run: |
          trivy fs --scanners vuln --severity CRITICAL,HIGH \
            --exit-code 0 \
            --format sarif -o trivy-backend.sarif \
            --ignorefile .trivyignore \
            backend/

      - name: Trivy vulnerability scan — frontend (filesystem scan)
        continue-on-error: true
        run: |
          trivy fs --scanners vuln --severity CRITICAL,HIGH \
            --exit-code 0 \
            --format sarif -o trivy-frontend.sarif \
            frontend/

      - name: Trivy summary report (non-blocking table)
        continue-on-error: true
        run: |
          trivy fs --scanners vuln --severity CRITICAL,HIGH,MEDIUM,LOW \
            --exit-code 0 \
            --format table \
            backend/requirements.txt

      - name: Check Trivy SARIF for CRITICAL unfixed vulnerabilities
        id: trivy-check
        shell: bash
        run: |
          if [ -f trivy-backend.sarif ]; then
            CRIT_COUNT=$(python -c "import json; data=json.load(open('trivy-backend.sarif')); runs=data.get('runs',[]); print(sum(1 for r in runs for result in r.get('results',[]) if result.get('level','')=='error'))" 2>/dev/null || echo "0")
            echo "CRITICAL/HIGH backend vulns: $CRIT_COUNT"
            if [ "$CRIT_COUNT" -gt 0 ]; then
              echo "::warning::Trivy found $CRIT_COUNT CRITICAL/HIGH vulnerabilities in backend dependencies."
              echo "::warning::See uploaded trivy-reports artifact for details."
              echo "::warning::Accepted risks are documented in docs/security-notes.md"
            fi
          fi
          if [ -f trivy-frontend.sarif ]; then
            CRIT_COUNT=$(python -c "import json; data=json.load(open('trivy-frontend.sarif')); runs=data.get('runs',[]); print(sum(1 for r in runs for result in r.get('results',[]) if result.get('level','')=='error'))" 2>/dev/null || echo "0")
            echo "CRITICAL/HIGH frontend vulns: $CRIT_COUNT"
            if [ "$CRIT_COUNT" -gt 0 ]; then
              echo "::warning::Trivy found $CRIT_COUNT CRITICAL/HIGH vulnerabilities in frontend dependencies."
              echo "::warning::See uploaded trivy-reports artifact for details."
              echo "::warning::Accepted risks are documented in docs/security-notes.md"
            fi
          fi

      - name: Upload Trivy SARIF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*.sarif
          retention-days: 30

      - name: Fail CI on CRITICAL unfixed vulnerabilities
        if: steps.trivy-check.outcome != 'success' && steps.trivy-check.outcome != 'skipped'
        run: |
          echo "CRITICAL or HIGH vulnerabilities found. Review the trivy-reports artifact."
          echo "If these are accepted risks, document them in docs/security-notes.md"
          exit 1
